description: "Informalize existing datasets using expand_langchain"

source:
  - !inc experiments/sources/raw/research_papers.nosorry.noprop.yaml

dataset:
  - !inc experiments/datasets/raw/research_papers.nosorry.noprop.yaml

graph:
  entry_point: informalize
  nodes:
    - name: informalize
      chains:
        - name: target_natural_language
          dependencies: []
          input_keys: [header, before_target_code, after_target_code, target_code, target_code_name]
          output_keys: [thoughts, target_natural_language]
          type: cot
          kwargs:
            n: 1
            llm: !inc experiments/llms/litellm/general/claude/sonnet-4-5.yaml
            parsers:
              - type: code_block
            prompt:
              type: chat
              kwargs:
                body_template_paths:
                  - experiments/templates/informalize
                system_template_paths:
                  - experiments/templates/informalize
  edges:
    - pair: [informalize, __end__]
      route: always
